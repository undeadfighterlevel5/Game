<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
// ===================== LEVEL DATA (edit to make new levels) =====================
// Spots = where figures pop up (960x540 coords). In Phase 3 these become hit zones over video.
const SPOTS = {
  winL:   { x: 234, y: 165, w: 81,  h: 99,  cover: 'window' },
  winR:   { x: 645, y: 165, w: 81,  h: 99,  cover: 'window' },
  door:   { x: 441, y: 246, w: 81,  h: 159, cover: 'door' },
  roof:   { x: 450, y: 0,   w: 69,  h: 66,  cover: 'roof' },
  barrel: { x: 90,  y: 300, w: 81,  h: 111, cover: 'barrel' },
  trough: { x: 780, y: 300, w: 81,  h: 111, cover: 'trough' },
  street: { x: 402, y: 258, w: 156, h: 216, cover: 'none' }, // showdown
};
// t = seconds into wave, window = seconds before an outlaw fires (scaled by difficulty)
const WAVES = [
  { name: 'Rough Welcome', events: [
    { t: 1.0, spot: 'winL',   type: 'outlaw',    window: 1.9 },
    { t: 3.0, spot: 'barrel', type: 'outlaw',    window: 1.7 },
    { t: 4.5, spot: 'door',   type: 'bystander', window: 1.8 },
    { t: 6.0, spot: 'trough', type: 'outlaw',    window: 1.5 },
    { t: 7.0, spot: 'winR',   type: 'outlaw',    window: 1.5 },
  ]},
  { name: 'Trouble Upstairs', events: [
    { t: 1.0, spot: 'roof',   type: 'outlaw',    window: 1.3 },
    { t: 2.5, spot: 'winL',   type: 'bystander', window: 1.6 },
    { t: 3.0, spot: 'winR',   type: 'outlaw',    window: 1.3 },
    { t: 4.5, spot: 'door',   type: 'outlaw',    window: 1.2 },
    { t: 6.0, spot: 'barrel', type: 'bystander', window: 1.5 },
    { t: 6.3, spot: 'trough', type: 'outlaw',    window: 1.1 },
  ]},
  { name: 'The Whole Gang', events: [
    { t: 1.0, spot: 'winL',   type: 'outlaw',    window: 1.1 },
    { t: 1.2, spot: 'winR',   type: 'outlaw',    window: 1.1 },
    { t: 2.8, spot: 'door',   type: 'bystander', window: 1.4 },
    { t: 3.2, spot: 'roof',   type: 'outlaw',    window: 1.0 },
    { t: 4.6, spot: 'barrel', type: 'outlaw',    window: 1.0 },
    { t: 4.8, spot: 'trough', type: 'outlaw',    window: 1.0 },
    { t: 6.5, spot: 'door',   type: 'outlaw',    window: 0.9 },
  ]},
];
const DIFFICULTY = {
  deputy:     { name: 'Deputy',     mult: 1.35, lives: 5, draw: 0.9 },
  gunslinger: { name: 'Gunslinger', mult: 0.8,  lives: 3, draw: 0.55 },
};
const HURT = {
  shot:      { title: "YOU'VE BEEN SHOT!", reason: 'AN OUTLAW GOT YOU FIRST.', color: '#ff3b30' },
  bystander: { title: 'INNOCENT DOWN!',    reason: 'YOU SHOT A TOWNSFOLK.',    color: '#7fb2ff' },
  early:     { title: 'DREW TOO EARLY!',   reason: 'WAIT FOR THE BELL.',       color: '#ffb347' },
  duel:      { title: 'TOO SLOW, PARTNER', reason: 'HE OUTDREW YOU.',          color: '#ff3b30' },
};
const QUIPS = {
  shot:      ['"SON, YOU\'RE SUPPOSED TO SHOOT FIRST."', '"I\'LL PATCH YOU UP, BUT I\'M BILLIN\' YA."', '"THIRD HOLE THIS WEEK. IN YOU."'],
  bystander: ['"THAT WAS THE PIANO PLAYER. NOW WHO PLAYS?"', '"SHOOT THE ONES WITH GUNS, STRANGER."', '"THE SHERIFF\'S GONNA WANT A WORD."'],
  early:     ['"YOU DRAW BEFORE THE BELL, YOU GET BURIED."', '"PATIENCE, COWBOY. PATIENCE."'],
  duel:      ['"HE WAS FASTER. SHOCKING, I KNOW."', '"NEXT TIME, TRY PULLING THE TRIGGER."'],
};

// ===================== PIXEL ART =====================
const PAL = { K: '#1b1410', S: '#e8b07a', E: '#1b1410', R: '#c0302b', B: '#3a2f45', G: '#b8b8c0', Y: '#7a5224', W: '#f4efe0', L: '#4a7ab8', D: '#5b4636' };
const PAL_FLASH = Object.fromEntries(Object.keys(PAL).map(k => [k, '#ffffff']));
const OUTLAW_AIM = [
  '...KKKKKK....', '...KKKKKK....', '.KKKKKKKKKK..', '....SSSSS....', '....SESES....', '....RRRRR....',
  '...RRRRRRR...', '..BBBBBBBBB..', '.BBBBBBBBBSGG', '.BBBBBBBBBB..', '..BBBBBBBB...', '..BBBBBBBB...',
  '..YYYYYYYY...', '..BBBBBBBB...', '..BBB..BBB...', '..BBB..BBB...', '..BBB..BBB...', '..KKK..KKK...',
];
const OUTLAW_HOLSTER = OUTLAW_AIM.map((r, i) => i === 8 || i === 9 ? '..BBBBBBBBB..' : i === 12 ? '..YYYYYYYYG..' : i === 13 ? '..BBBBBBBBG..' : r);
const BYSTANDER = [
  '.S.........S.', '.S..WWWWW..S.', '.S..WWWWW..S.', '.SWWWWWWWWWS.', '.S..SSSSS..S.', '.S..SESES..S.',
  '.SS.SSSSS.SS.', '..SLLLLLLLS..', '...LLLLLLL...', '...LLLLLLL...', '...LLLLLLL...', '...YYYYYYY...',
  '...DDDDDDD...', '...DDDDDDD...', '...DDD.DDD...', '...DDD.DDD...', '...DDD.DDD...', '...KKK.KKK...',
];
const OUTLAW_HIT = [
  '.............', '.............', '.............', '....SSSSS....', '....SESES....', '....RRRRR....',
  'S..RRRRRRR..S', 'SBBBBBBBBBBBS', '..BBBBBBBBB..', '..BBBBBBBBB..', '..BBBBBBBB...', '..BBBBBBBB...',
  '..YYYYYYYY...', '..BBBBBBBB...', '..BBB..BBB...', '..BBB..BBB...', '..BBB..BBB...', '..KKK..KKK...',
];
const HAT = ['...KKKKKK....', '...KKKKKK....', '.KKKKKKKKKK..'];
const HAT_FLIP = [...HAT].reverse();
const HEART = ['.RR.RR.', 'RWRRRRR', 'RRRRRRR', '.RRRRR.', '..RRR..', '...R...'];
const HEART_PAL = { R: '#e0362c', W: '#ffd0c8' }, HEART_EMPTY = { R: '#3b2a24', W: '#3b2a24' };
const BULLET = ['.C.', 'CCC', 'CCC', 'YYY', 'YWY', 'YYY', 'YYY', 'DDD'];
const BULLET_PAL = { C: '#c8743a', Y: '#e2b33c', W: '#fff0a8', D: '#9a7420' };
const BULLET_SPENT = { C: '#3b2a24', Y: '#3b2a24', W: '#3b2a24', D: '#3b2a24' };
const GLYPH = { S: ['111','100','111','001','111'], A: ['010','101','111','101','101'], L: ['100','100','100','100','111'], O: ['111','101','101','101','111'], N: ['1001','1101','1011','1001','1001'] };

// ===================== ENGINE STATE =====================
const W = 960, H = 540, P = 3, LW = 320, LH = 180;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = LW; buf.height = LH;
const g = buf.getContext('2d');
const FONT = '"Press Start 2P", monospace';
if (document.fonts && document.fonts.load) document.fonts.load('16px "Press Start 2P"');

let state = 'title', diff = DIFFICULTY.deputy, waveIdx = 0, inDuel = false;
let time = 0, nextEvent = 0, actives = [], lives = 3, ammo = 6, score = 0, waveStartScore = 0;
let shots = 0, hits = 0, timer = 0, quip = '', lastHurt = 'shot', clock = 0;
let flash = 0, muzzle = 0, shake = 0, mouse = { x: W / 2, y: H / 2 }, effects = [];
let duelT = 0, drawAt = 0, boss = null, newBest = false;
let best = +(localStorage.getItem('hns_best') || 0);
const BTN = { deputy: { x: 168, y: 356, w: 288, h: 84 }, gunslinger: { x: 504, y: 356, w: 288, h: 84 } };
const AMMO_BOX = { x: W - 162, y: H - 78, w: 150, h: 66 };
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const SPECKS = Array.from({ length: 140 }, () => ({ x: Math.floor(rnd() * LW), y: 103 + Math.floor(rnd() * 77), c: rnd() < 0.5 ? '#a8763c' : '#d6a865' }));
let tumble = { x: -20, t: 5 };

// ===================== SOUND (Web Audio, no files) =====================
let ac = null;
function audio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); }
function noise(dur, vol, lp) {
  if (!ac) return;
  const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  const s = ac.createBufferSource(), gn = ac.createGain(), f = ac.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = lp || 4000; gn.gain.value = vol;
  s.buffer = b; s.connect(f).connect(gn).connect(ac.destination); s.start();
}
function tone(type, f1, f2, dur, vol) {
  if (!ac) return;
  const o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(gn).connect(ac.destination); o.start(); o.stop(t + dur);
}
const sfx = {
  gun:      () => { noise(0.35, 0.7, 2500); tone('sine', 120, 40, 0.2, 0.5); },
  ricochet: () => tone('sine', 2200 + Math.random() * 800, 500, 0.35, 0.12),
  hit:      () => tone('triangle', 180, 60, 0.15, 0.4),
  empty:    () => tone('square', 160, 140, 0.05, 0.08),
  reload:   () => { for (let i = 0; i < 3; i++) setTimeout(() => tone('square', 900, 700, 0.04, 0.06), i * 70); },
  hurt:     () => { noise(0.5, 0.9, 1200); tone('sawtooth', 200, 50, 0.5, 0.2); },
  oops:     () => { tone('triangle', 700, 180, 0.5, 0.25); setTimeout(() => tone('triangle', 400, 120, 0.5, 0.2), 180); },
  bell:     () => { tone('sine', 880, 870, 1.2, 0.3); tone('sine', 1320, 1300, 0.8, 0.12); },
  win:      () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone('square', f, f, 0.25, 0.1), i * 150)),
};

// ===================== GAME FLOW =====================
function startGame(d) {
  diff = DIFFICULTY[d]; lives = diff.lives; score = 0; shots = 0; hits = 0; effects = []; newBest = false;
  startWave(0);
}
function startWave(i) {
  waveIdx = i; inDuel = false; time = 0; nextEvent = 0; actives = []; ammo = 6; waveStartScore = score;
  if (i >= WAVES.length) return startDuel();
  state = 'intro'; timer = 1.8;
}
function startDuel() {
  inDuel = true; actives = []; ammo = 6; waveStartScore = score;
  state = 'intro'; timer = 1.8;
  boss = { spot: 'street', type: 'outlaw', age: 0, window: 99, rise: 1, dead: false, deadTime: 0, boss: true };
}
function reload() { if (ammo < 6) { ammo = 6; sfx.reload(); } }
function hurt(kind) {
  lives--; lastHurt = kind; flash = 1; shake = 0.4; actives = [];
  kind === 'bystander' ? sfx.oops() : sfx.hurt();
  const list = QUIPS[kind]; quip = list[Math.floor(Math.random() * list.length)];
  score = waveStartScore; // no farming points by dying mid-wave
  if (lives <= 0) { state = 'over'; saveBest(); } else { state = 'hurt'; timer = 2.8; }
}
function saveBest() { if (score > best) { best = score; newBest = true; localStorage.setItem('hns_best', best); } }
function inBox(x, y, s) { return x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h; }

function shoot(x, y) {
  if (ammo <= 0) { sfx.empty(); return; }
  ammo--; shots++; muzzle = 0.07; shake = Math.max(shake, 0.08); sfx.gun();
  if (inDuel) {
    if (state === 'duelWait') return hurt('early');
    if (state === 'duelDraw' && inBox(x, y, SPOTS.street)) {
      hits++; boss.dead = true; boss.deadTime = 0; knockOff(boss); sfx.hit();
      const bonus = Math.round(500 * Math.max(0, 1 - duelT / diff.draw));
      score += 500 + bonus; effects.push({ x: 480, y: 220, life: 1, text: '+' + (500 + bonus) });
      state = 'duelWon'; timer = 1.8; return;
    }
    return miss(x, y);
  }
  for (let i = actives.length - 1; i >= 0; i--) {
    const a = actives[i], s = SPOTS[a.spot];
    if (a.dead || a.rise < 0.6 || !inBox(x, y, s)) continue;
    a.dead = true; a.deadTime = 0; sfx.hit();
    if (a.type === 'outlaw') {
      hits++; knockOff(a);
      const bonus = Math.round(100 * Math.max(0, 1 - a.age / a.window));
      score += 100 + bonus;
      effects.push({ x: s.x + s.w / 2, y: Math.max(s.y, 60), life: 0.8, text: '+' + (100 + bonus) });
    } else hurt('bystander');
    return;
  }
  miss(x, y);
}
function knockOff(a) {
  const s = SPOTS[a.spot], sc = a.boss ? 4 : 2;
  a.dir = Math.random() < 0.5 ? -1 : 1;
  const x = Math.round(Lo(s.x + s.w / 2) - 13 * sc / 2), y = Lo(s.y) + (a.boss ? 0 : 2);
  effects.push({ phys: true, hat: true, sc, x, y, vx: a.dir * (25 + Math.random() * 20), vy: -110 - Math.random() * 30, life: 1.3 });
  effects.push({ phys: true, gun: true, sc, x: x + 11 * sc, y: y + 8 * sc, vx: -a.dir * 20, vy: -50, life: 0.9 });
}
function miss(x, y) {
  effects.push({ x, y, life: 0.4, hole: true });
  for (let i = 0; i < 6; i++) effects.push({ x, y, life: 0.5, dust: true, vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 90 });
  if (Math.random() < 0.5) sfx.ricochet();
}

function update(dt) {
  clock += dt;
  flash = Math.max(0, flash - dt * 2); muzzle = Math.max(0, muzzle - dt); shake = Math.max(0, shake - dt);
  effects.forEach(e => { e.life -= dt; if (e.dust) { e.x += e.vx * dt; e.y += e.vy * dt; } if (e.phys) { e.vy += 320 * dt; e.x += e.vx * dt; e.y += e.vy * dt; } });
  effects = effects.filter(e => e.life > 0);
  if (boss && boss.dead) boss.deadTime += dt;
  tumble.t -= dt;
  if (tumble.t <= 0) { tumble.x += dt * 45; if (tumble.x > LW + 10) { tumble.x = -20; tumble.t = 8 + rnd() * 10; } }

  if (state === 'intro') {
    timer -= dt;
    if (timer <= 0) {
      if (inDuel) { state = 'duelWait'; duelT = 0; drawAt = 1.5 + Math.random() * 2.5; boss.dead = false; boss.deadTime = 0; }
      else state = 'play';
    }
    return;
  }
  if (state === 'hurt') { timer -= dt; if (timer <= 0) inDuel ? startDuel() : startWave(waveIdx); return; }
  if (state === 'duelWait') { duelT += dt; if (duelT >= drawAt) { state = 'duelDraw'; duelT = 0; sfx.bell(); } return; }
  if (state === 'duelDraw') { duelT += dt; boss.age = duelT; boss.window = diff.draw; if (duelT >= diff.draw) hurt('duel'); return; }
  if (state === 'duelWon') { timer -= dt; if (timer <= 0) { state = 'win'; saveBest(); sfx.win(); } return; }
  if (state !== 'play') return;

  time += dt;
  const evs = WAVES[waveIdx].events;
  while (nextEvent < evs.length && evs[nextEvent].t <= time) {
    const e = evs[nextEvent++];
    actives.push({ ...e, window: e.window * diff.mult, age: 0, rise: 0, dead: false, deadTime: 0 });
  }
  for (const a of actives) {
    a.rise = Math.min(1, a.rise + dt * 6);
    if (a.dead) { a.deadTime += dt; continue; }
    a.age += dt;
    if (a.age >= a.window) {
      if (a.type === 'outlaw') { hurt('shot'); return; }
      a.gone = true; // bystander leaves safely
    }
  }
  actives = actives.filter(a => !a.gone && !(a.dead && a.deadTime > 0.9));
  if (nextEvent >= evs.length && actives.length === 0) startWave(waveIdx + 1);
}

// ===================== PIXEL WORLD (drawn at 320x180, scaled 3x) =====================
const Lo = v => Math.round(v / P);
function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }
function sprite(c, rows, pal, x, y, sc, shear = 0) {
  const n = rows.length;
  for (let r = 0; r < n; r++) {
    const off = shear ? Math.round(shear * (n - 1 - r) / (n - 1)) * sc : 0; // top leans, feet stay planted
    for (let i = 0; i < rows[r].length; i++) {
      const ch = rows[r][i]; if (ch === '.') continue;
      c.fillStyle = pal[ch]; c.fillRect(x + off + i * sc, y + r * sc, sc, sc);
    }
  }
}
function tinyText(str, x, y, col) {
  g.fillStyle = col;
  let cx = x;
  for (const ch of str) { const gl = GLYPH[ch]; gl.forEach((row, r) => [...row].forEach((b, i) => { if (b === '1') g.fillRect(cx + i, y + r, 1, 1); })); cx += gl[0].length + 1; }
}
function cactus(x, y) {
  const c = '#4f7a3a';
  rect(g, x, y, 3, 14, c); rect(g, x - 3, y + 5, 3, 2, c); rect(g, x - 3, y + 2, 2, 4, c);
  rect(g, x + 3, y + 7, 3, 2, c); rect(g, x + 4, y + 4, 2, 4, c); rect(g, x + 1, y + 1, 1, 12, '#6b9a4a');
}
const SKY = ['#c4503a', '#e0733f', '#f29a52', '#fbc672'];
function drawBackdrop() {
  for (let i = 0; i < 4; i++) {
    rect(g, 0, i * 25, LW, 25, SKY[i]);
    if (i) { g.fillStyle = SKY[i - 1]; for (let x = 0; x < LW; x += 2) { g.fillRect(x, i * 25, 1, 1); g.fillRect(x + 1, i * 25 + 2, 1, 1); } }
  }
  g.fillStyle = '#fff1c1';
  for (let dy = -12; dy <= 12; dy++) { const w = Math.floor(Math.sqrt(144 - dy * dy)); g.fillRect(272 - w, 26 + dy, w * 2, 1); }
  rect(g, 0, 80, 70, 20, '#a4513b'); rect(g, 8, 72, 38, 8, '#a4513b'); rect(g, 8, 72, 38, 2, '#c06a4a');
  rect(g, 250, 76, 70, 24, '#a4513b'); rect(g, 266, 66, 34, 10, '#a4513b'); rect(g, 266, 66, 34, 2, '#c06a4a');
  rect(g, 0, 100, LW, 80, '#c4914f'); rect(g, 0, 100, LW, 2, '#a8763c');
  for (const s of SPECKS) rect(g, s.x, s.y, 1, 1, s.c);
  cactus(14, 104); cactus(302, 112);
  rect(g, 60, 40, 200, 97, '#8a5530');
  for (let y = 44; y < 137; y += 5) rect(g, 60, y, 200, 1, '#6e4224');
  rect(g, 56, 40, 208, 3, '#5a3418');
  for (const k of ['winL', 'winR', 'door']) { const s = SPOTS[k]; rect(g, Lo(s.x), Lo(s.y), Lo(s.w), Lo(s.h), '#1e120a'); }
  rect(g, 53, 135, 214, 5, '#5a3418'); rect(g, 53, 135, 214, 1, '#9a6236');
}
function frame(x, y, w, h, col) { rect(g, x - 2, y - 2, w + 4, 2, col); rect(g, x - 2, y + h, w + 4, 2, col); rect(g, x - 2, y, 2, h, col); rect(g, x + w, y, 2, h, col); }
function drawCovers() {
  for (const k in SPOTS) {
    const s = SPOTS[k], x = Lo(s.x), y = Lo(s.y), w = Lo(s.w), h = Lo(s.h);
    if (s.cover === 'window') { frame(x, y, w, h, '#4a2a14'); rect(g, x - 4, y + h + 2, w + 8, 2, '#3b2210'); }
    if (s.cover === 'door') {
      frame(x, y, w, h, '#4a2a14');
      const pw = Math.floor(w / 2) - 1;
      for (const dx of [0, w - pw]) {
        rect(g, x + dx, y + 16, pw, 20, '#9a6236'); rect(g, x + dx, y + 16, pw, 1, '#c98a4b');
        for (let yy = y + 20; yy < y + 36; yy += 4) rect(g, x + dx, yy, pw, 1, '#6e4224');
      }
    }
    if (s.cover === 'roof') {
      rect(g, 133, 20, 54, 22, '#7a4a28'); rect(g, 131, 20, 58, 2, '#5a3418');
      rect(g, 138, 24, 44, 13, '#3b2210'); rect(g, 139, 25, 42, 11, '#ecd8a4'); tinyText('SALOON', 148, 28, '#8a1f1a');
    }
    if (s.cover === 'barrel') {
      const by = y + 18;
      rect(g, x, by, w, 23, '#8b5a2b'); rect(g, x, by, w, 2, '#5a3418');
      rect(g, x, by + 4, w, 2, '#3d3d3d'); rect(g, x, by + 16, w, 2, '#3d3d3d'); rect(g, x + 5, by + 2, 2, 21, '#a8743d');
    }
    if (s.cover === 'trough') {
      const ty = y + 20;
      rect(g, x - 7, ty, w + 14, 14, '#6b4423'); rect(g, x - 5, ty + 1, w + 10, 2, '#5b9fd0');
      rect(g, x - 7, ty + 6, w + 14, 1, '#4e2f17'); rect(g, x - 5, ty + 14, 3, 4, '#4e2f17'); rect(g, x + w + 2, ty + 14, 3, 4, '#4e2f17');
    }
  }
}
function drawTumble() {
  if (tumble.t > 0) return;
  const x = Math.round(tumble.x), y = 150 - Math.round(Math.abs(Math.sin(tumble.x / 7)) * 6), f = Math.floor(tumble.x / 4) % 2;
  const c = '#8a6a3a';
  rect(g, x + 1, y, 4, 1, c); rect(g, x, y + 1, 1, 4, c); rect(g, x + 5, y + 1, 1, 4, c); rect(g, x + 1, y + 5, 4, 1, c);
  if (f) { rect(g, x + 2, y + 2, 2, 2, c); } else { rect(g, x + 1, y + 2, 1, 1, c); rect(g, x + 4, y + 3, 1, 1, c); }
}
function drawPerson(a) {
  const s = SPOTS[a.spot], sc = a.boss ? 4 : 2;
  const holster = a.boss && state !== 'duelDraw' && !a.dead;
  let rows = a.type === 'bystander' ? BYSTANDER : holster ? OUTLAW_HOLSTER : OUTLAW_AIM;
  let x = Math.round(Lo(s.x + s.w / 2) - 13 * sc / 2);
  let y = Lo(s.y) + (a.boss ? 0 : 2) + Math.round((1 - a.rise) * (Lo(s.h) + 4));
  let pal = PAL, shear = 0;
  if (a.dead) {
    const t = a.deadTime, dir = a.dir || 1;
    if (a.type === 'outlaw') rows = OUTLAW_HIT;
    if (t < 0.1) { pal = PAL_FLASH; x += dir * sc; y -= sc; }                       // impact flash + jolt
    else if (t < 0.3) { y -= sc; x += (Math.floor(t * 30) % 2 ? 1 : -1) * Math.ceil(sc / 2); } // stagger
    else {                                                                          // topple + slump
      const k = Math.min(1, (t - 0.3) * 3.5);
      shear = dir * Math.round(k * 7);
      y += a.boss ? Math.round(k * 8) * sc : Math.round(Math.pow(t - 0.3, 2) * 260);
    }
  }
  g.save();
  if (!a.boss) { g.beginPath(); g.rect(Lo(s.x) - 8, Lo(s.y) - 10, Lo(s.w) + 16, Lo(s.h) + 10); g.clip(); }
  sprite(g, rows, pal, x, y, sc, shear);
  if (a.type === 'outlaw' && !a.dead && !holster && a.age > a.window * 0.6 && Math.floor(a.age * 12) % 2)
    rect(g, x + 13 * sc, y + 7 * sc, sc * 2, sc * 3, '#fff36b');
  g.restore();
  if (a.type === 'outlaw' && !a.boss && !a.dead && a.rise >= 1) {
    const p = Math.max(0, 1 - a.age / a.window), bw = Lo(s.w), bx = Lo(s.x);
    const by = s.y < 30 ? Lo(s.y + s.h) + 2 : Lo(s.y) - 7;
    rect(g, bx - 1, by - 1, bw + 2, 4, '#1b1410');
    rect(g, bx, by, Math.round(bw * p), 2, p > 0.4 ? '#ffd23f' : '#ff3b30');
  }
}
function drawWorld() {
  drawBackdrop();
  if (!inDuel) actives.forEach(drawPerson);
  drawCovers();
  drawTumble();
  if (inDuel && boss) { g.fillStyle = 'rgba(40,10,0,.45)'; g.fillRect(0, 0, LW, LH); drawPerson(boss); }
  for (const e of effects) {
    if (e.text) continue;
    if (e.hat) { sprite(g, Math.floor(e.life * 14) % 2 ? HAT : HAT_FLIP, PAL, Math.round(e.x), Math.round(e.y), e.sc); continue; }
    if (e.gun) { rect(g, Math.round(e.x), Math.round(e.y), 2 * e.sc, e.sc, '#b8b8c0'); continue; }
    if (e.dust) rect(g, Lo(e.x), Lo(e.y), 1, 1, '#e8cc98');
    else rect(g, Lo(e.x) - 1, Lo(e.y) - 1, 2, 2, '#1b1410');
  }
  if (muzzle > 0) {
    const mx = Lo(mouse.x), my = Lo(mouse.y);
    g.fillStyle = 'rgba(255,240,180,.18)'; g.fillRect(0, 0, LW, LH);
    rect(g, mx - 6, my, 13, 1, '#fff36b'); rect(g, mx, my - 6, 1, 13, '#fff36b');
    for (const [dx, dy] of [[-4, -4], [4, -4], [-4, 4], [4, 4]]) rect(g, mx + dx, my + dy, 1, 1, '#fff36b');
    rect(g, mx - 2, my - 2, 5, 5, '#ffffff');
  }
}

// ===================== PIXEL UI (drawn at full res, 3px grid) =====================
function text(s, x, y, size, col, align = 'left') {
  ctx.font = size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'top';
  const o = size >= 32 ? 6 : 3;
  ctx.fillStyle = '#1b1410'; ctx.fillText(s, x + o, y + o);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function panel(x, y, w, h, fill = '#5a3418') {
  rect(ctx, x, y, w, h, '#1b1410');
  rect(ctx, x + 3, y + 3, w - 6, h - 6, '#c98a4b');
  rect(ctx, x + 6, y + 6, w - 12, h - 12, fill);
  for (let yy = y + 27; yy < y + h - 12; yy += 24) rect(ctx, x + 6, yy, w - 12, 3, 'rgba(0,0,0,.12)');
  for (const [nx, ny] of [[x + 12, y + 12], [x + w - 18, y + 12], [x + 12, y + h - 18], [x + w - 18, y + h - 18]]) rect(ctx, nx, ny, 6, 6, '#e2b33c');
}
function dim(a) { ctx.fillStyle = `rgba(20,10,5,${a})`; ctx.fillRect(0, 0, W, H); }
function wrap(s, n) {
  const out = []; let line = '';
  for (const w of s.split(' ')) { if ((line + ' ' + w).trim().length > n) { out.push(line); line = w; } else line = line ? line + ' ' + w : w; }
  if (line) out.push(line); return out;
}
function button(b, label, sub) {
  const hover = inBox(mouse.x, mouse.y, b);
  panel(b.x, b.y, b.w, b.h, hover ? '#9a6236' : '#5a3418');
  text(label, b.x + b.w / 2, b.y + 18, 24, hover ? '#ffd23f' : '#ffffff', 'center');
  text(sub, b.x + b.w / 2, b.y + 54, 16, '#f3d18b', 'center');
}
function drawHUD() {
  panel(12, 12, 252, 84);
  text('SCORE', 33, 30, 16, '#f3d18b');
  text(String(score).padStart(6, '0'), 33, 57, 24, '#ffffff');
  const hw = 36 + diff.lives * 27, hx = W - 12 - hw;
  panel(hx, 12, hw, 54);
  for (let i = 0; i < diff.lives; i++) sprite(ctx, HEART, i < lives ? HEART_PAL : HEART_EMPTY, hx + 18 + i * 27, 30, 3);
  panel(12, H - 78, 264, 66);
  text(inDuel ? 'SHOWDOWN' : 'WAVE ' + (waveIdx + 1) + '/' + WAVES.length, 33, H - 60, 16, '#ffffff');
  text(diff.name.toUpperCase(), 33, H - 36, 16, '#f3d18b');
  const a = AMMO_BOX;
  panel(a.x, a.y, a.w, a.h);
  for (let i = 0; i < 6; i++) sprite(ctx, BULLET, i < ammo ? BULLET_PAL : BULLET_SPENT, a.x + 18 + i * 21, a.y + 21, 3);
  const blink = Math.floor(clock * 3) % 2;
  if (ammo === 0) { if (blink) text('RELOAD! [R]', W - 12, a.y - 30, 16, '#ff3b30', 'right'); }
  else if (ammo <= 2) text('LOW AMMO [R]', W - 12, a.y - 30, 16, '#ffd23f', 'right');
}
function drawCrosshair() {
  const x = Math.round(mouse.x / P) * P, y = Math.round(mouse.y / P) * P;
  const arms = [[x - 24, y - 3, 15, 6], [x + 9, y - 3, 15, 6], [x - 3, y - 24, 6, 15], [x - 3, y + 9, 6, 15]];
  for (const [ax, ay, aw, ah] of arms) rect(ctx, ax - 3, ay - 3, aw + 6, ah + 6, '#1b1410');
  for (const [ax, ay, aw, ah] of arms) rect(ctx, ax, ay, aw, ah, '#ffffff');
  rect(ctx, x - 3, y - 3, 6, 6, '#ff3b30');
}
function stats(y) {
  const acc = shots ? Math.round(hits / shots * 100) : 0;
  text('SCORE ' + score + '   ACC ' + acc + '%', W / 2, y, 16, '#ffffff', 'center');
  text(newBest ? 'NEW BEST!' : 'BEST ' + best, W / 2, y + 30, 16, '#ffd23f', 'center');
}
function draw() {
  drawWorld();
  ctx.imageSmoothingEnabled = false;
  rect(ctx, 0, 0, W, H, '#1b1410');
  const sx = shake > 0 ? Math.round((Math.random() - 0.5) * shake * 12) * P : 0;
  const sy = shake > 0 ? Math.round((Math.random() - 0.5) * shake * 12) * P : 0;
  ctx.drawImage(buf, sx, sy, W, H);
  if (flash > 0) { ctx.fillStyle = lastHurt === 'bystander' ? `rgba(60,90,200,${flash * 0.45})` : `rgba(200,0,0,${flash * 0.45})`; ctx.fillRect(0, 0, W, H); }
  for (const e of effects) if (e.text) { ctx.globalAlpha = Math.min(1, e.life * 3); text(e.text, e.x, e.y - (1 - e.life) * 40, 16, '#ffd23f', 'center'); ctx.globalAlpha = 1; }

  const blink = Math.floor(clock * 2.5) % 2;
  if (state !== 'title') drawHUD();
  if (state === 'title') {
    dim(0.55);
    text('HIGH NOON', W / 2, 54, 48, '#f4efe0', 'center');
    text('SALOON', W / 2, 114, 48, '#ffd23f', 'center');
    panel(W / 2 - 312, 186, 624, 120);
    text('SHOOT OUTLAWS BEFORE THEY FIRE', W / 2, 210, 16, '#ffffff', 'center');
    text("DON'T SHOOT HANDS-UP FOLKS", W / 2, 240, 16, '#7fb2ff', 'center');
    text('RELOAD: R / RIGHT-CLICK / TAP AMMO', W / 2, 270, 16, '#f3d18b', 'center');
    if (blink) text('CHOOSE YOUR BADGE', W / 2, 326, 16, '#ffffff', 'center');
    button(BTN.deputy, 'DEPUTY', '5 LIVES - EASY');
    button(BTN.gunslinger, 'GUNSLINGER', '3 LIVES - HARD');
    if (best) text('BEST ' + best, W / 2, 465, 16, '#ffd23f', 'center');
  }
  if (state === 'intro') {
    dim(0.35); panel(W / 2 - 270, 180, 540, 150);
    if (inDuel) {
      text('SHOWDOWN', W / 2, 204, 32, '#ff3b30', 'center');
      text('WAIT FOR THE BELL...', W / 2, 256, 16, '#ffffff', 'center');
      text('THEN DRAW!', W / 2, 288, 16, '#ffd23f', 'center');
    } else {
      text('WAVE ' + (waveIdx + 1), W / 2, 204, 32, '#ffd23f', 'center');
      text(WAVES[waveIdx].name.toUpperCase(), W / 2, 256, 16, '#ffffff', 'center');
      text('GET READY...', W / 2, 288, 16, '#f3d18b', 'center');
    }
  }
  if (state === 'duelWait') text('STEADY...', W / 2, 110, 24, '#f4efe0', 'center');
  if (state === 'duelDraw') text('DRAW!', W / 2, 96, 64, Math.floor(clock * 10) % 2 ? '#ff3b30' : '#ffd23f', 'center');
  if (state === 'hurt') {
    const h = HURT[lastHurt];
    dim(0.55); panel(W / 2 - 336, 140, 672, 260);
    text(h.title, W / 2, 166, 32, h.color, 'center');
    text(h.reason, W / 2, 218, 16, '#ffffff', 'center');
    text('THE DOC SAYS:', W / 2, 254, 16, '#f3d18b', 'center');
    wrap(quip, 36).forEach((l, i) => text(l, W / 2, 282 + i * 24, 16, '#f4efe0', 'center'));
    text(inDuel ? 'RETRYING SHOWDOWN...' : 'RESTARTING WAVE...', W / 2, 360, 16, '#a88a6a', 'center');
  }
  if (state === 'over') {
    dim(0.65); panel(W / 2 - 336, 100, 672, 340);
    text('GAME OVER', W / 2, 126, 40, '#ff3b30', 'center');
    text(HURT[lastHurt].reason, W / 2, 190, 16, '#ffffff', 'center');
    wrap(quip, 36).forEach((l, i) => text(l, W / 2, 224 + i * 24, 16, '#f4efe0', 'center'));
    stats(300);
    if (blink) text('CLICK TO CONTINUE', W / 2, 396, 16, '#f3d18b', 'center');
  }
  if (state === 'win') {
    dim(0.55); panel(W / 2 - 336, 100, 672, 340);
    text('TOWN SAVED!', W / 2, 126, 40, '#ffd23f', 'center');
    text('THE GANG IS FINISHED.', W / 2, 190, 16, '#ffffff', 'center');
    text(diff.name.toUpperCase() + ' DIFFICULTY', W / 2, 224, 16, '#f3d18b', 'center');
    stats(282);
    if (blink) text('CLICK TO CONTINUE', W / 2, 396, 16, '#f3d18b', 'center');
  }
  drawCrosshair();
}

// ===================== INPUT =====================
function toGame(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointermove', e => { mouse = toGame(e); });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  audio(); mouse = toGame(e);
  if (state === 'title') {
    if (inBox(mouse.x, mouse.y, BTN.deputy)) startGame('deputy');
    else if (inBox(mouse.x, mouse.y, BTN.gunslinger)) startGame('gunslinger');
    return;
  }
  if (state === 'over' || state === 'win') { state = 'title'; inDuel = false; actives = []; return; }
  if (!['play', 'duelWait', 'duelDraw'].includes(state)) return;
  if (e.button === 2 || inBox(mouse.x, mouse.y, AMMO_BOX)) { reload(); return; }
  shoot(mouse.x, mouse.y);
});
window.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'r' && ['play', 'duelWait', 'duelDraw'].includes(state)) reload(); });

// ===================== LOOP =====================
let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
